<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X Bookmark Saver</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>X Bookmark Saver</h1>

    <div class="status" id="status">
      準備完了
    </div>

    <div class="action-section">
      <p class="info">
        <strong>x.com/bookmarks</strong> を開いてから実行してください。
      </p>

      <div class="input-group">
        <label for="limitMode">収集範囲:</label>
        <select id="limitMode">
          <option value="count" selected>件数で指定（最新からN件）</option>
          <option value="days">日数で指定（直近N日以内）</option>
          <option value="all">制限なし（全ての未収集）</option>
        </select>
      </div>

      <div class="input-group" id="limitCountGroup">
        <label for="limitCount">取得件数:</label>
        <input type="number" id="limitCount" value="50" min="1" step="10">
        <span class="hint">件</span>
      </div>

      <div class="input-group" id="limitDaysGroup" style="display:none;">
        <label for="limitDays">直近の日数:</label>
        <input type="number" id="limitDays" value="30" min="1" step="1">
        <span class="hint">日以内</span>
      </div>

      <button id="collectButton" class="btn btn-success">
        ブックマークを収集
      </button>
      <button id="resetButton" class="btn btn-danger" style="margin-top: 8px;">
        収集履歴をリセット（全件再取得）
      </button>

      <div class="progress-container" id="progressContainer" style="display: none;">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">0 / 0</div>
      </div>
    </div>

    <div class="export-section">
      <h3>エクスポート設定</h3>

      <div class="input-group">
        <label for="format">形式:</label>
        <select id="format">
          <option value="markdown">Markdown (.md)</option>
          <option value="json">JSON (.json)</option>
          <option value="text">Text (.txt)</option>
        </select>
      </div>

      <div class="checkbox-group">
        <label>
          <input type="checkbox" id="includeImages" checked>
          画像を含める
        </label>
        <label>
          <input type="checkbox" id="includeThreads" checked>
          スレッド全体を含める
        </label>
      </div>

      <button id="exportButton" class="btn btn-primary" disabled>
        ローカルにダウンロード
      </button>
    </div>

    <div class="log-section">
      <h3>ログ</h3>
      <div id="log" class="log"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
